name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go build .
      - if: runner.os != 'Windows'
        run: sh -n install.sh uninstall.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw uninstall.ps1))

  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test BusyBox install on OpenWrt stable
        shell: bash
        run: |
          mkdir .openwrt-assets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .openwrt-assets/pdo_linux_amd64 .
          (cd .openwrt-assets && sha256sum pdo_linux_amd64 > SHA256SUMS)
          cp install.sh .openwrt-assets/install.sh
          sed -i 's#^pdo_base_url=.*#pdo_base_url="http://127.0.0.1:18080"#' .openwrt-assets/install.sh
          python3 -m http.server 18080 --directory .openwrt-assets >/tmp/pdo-openwrt-http.log 2>&1 &
          pdo_server=$!
          trap 'kill "$pdo_server"' EXIT
          for pdo_attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:18080/SHA256SUMS >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18080/SHA256SUMS >/dev/null
          docker run --rm --network host -v "$PWD/.openwrt-assets:/assets:ro" openwrt/rootfs:x86_64-24.10.8 sh -ec '
            mkdir -p /var/lock
            /assets/pdo_linux_amd64 __pdo-dependencies >/tmp/dependencies 2>&1
            grep -q "opkg install openssh-client" /tmp/dependencies
            opkg list-installed | grep -q "^dropbear "
            if opkg list-installed | grep -q "^openssh-client "; then
              echo "OpenSSH client was unexpectedly installed" >&2
              exit 1
            fi
            wget -qO- http://127.0.0.1:18080/install.sh | sh
            /root/.local/bin/pdo version | grep -q "pdo devel"
            if opkg list-installed | grep -q "^openssh-client "; then exit 1; fi
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release assets
        shell: bash
        run: |
          mkdir dist
          for pdo_os in darwin linux windows; do
            for pdo_arch in amd64 arm64; do
              pdo_output="dist/pdo_${pdo_os}_${pdo_arch}"
              if [ "$pdo_os" = windows ]; then pdo_output="${pdo_output}.exe"; fi
              CGO_ENABLED=0 GOOS="$pdo_os" GOARCH="$pdo_arch" go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$pdo_output" .
            done
          done
          (cd dist && sha256sum pdo_* > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 uninstall.sh uninstall.ps1 --generate-notes --verify-tag
