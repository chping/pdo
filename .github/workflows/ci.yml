name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go build .
      - if: runner.os != 'Windows'
        run: sh -n install.sh uninstall.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw uninstall.ps1))

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release assets
        shell: bash
        run: |
          mkdir dist
          for cpdo_os in darwin linux windows; do
            for cpdo_arch in amd64 arm64; do
              cpdo_output="dist/cpdo_${cpdo_os}_${cpdo_arch}"
              if [ "$cpdo_os" = windows ]; then cpdo_output="${cpdo_output}.exe"; fi
              CGO_ENABLED=0 GOOS="$cpdo_os" GOARCH="$cpdo_arch" go build -trimpath -ldflags="-s -w" -o "$cpdo_output" .
            done
          done
          (cd dist && sha256sum cpdo_* > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 uninstall.sh uninstall.ps1 --generate-notes --verify-tag
